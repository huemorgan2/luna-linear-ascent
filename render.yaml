# Render blueprint for worldd — the shared Linear Ascent world service.
# Deploy: push this repo to GitHub, then in Render → New → Blueprint, pick the repo.
# Set ASCENT_SHARED_SECRET and ASCENT_ADMIN_KEY in the dashboard
# (they are sync:false so they are not stored in git).

services:
  - type: web
    name: ascent-worldd
    runtime: python
    rootDir: worldd
    plan: starter                 # lowest paid plan — always-on, no scale-to-zero
    region: oregon
    healthCheckPath: /health
    numInstances: 1               # world-day rollover runs in-process; one owner
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ASCENT_SHARED_SECRET # HMAC worldd <-> Luna plugin. openssl rand -hex 32
        sync: false
      - key: ASCENT_ADMIN_KEY     # protects /admin/* (tenant registration). openssl rand -hex 16
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ascent-world-db
          property: connectionString

databases:
  - name: ascent-world-db
    plan: starter
    region: oregon
    postgresMajorVersion: "16"
