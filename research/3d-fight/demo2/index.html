<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3d-fight demo2 — 320x112, floor 1</title>
<style>
  :root {
    --ink: #0b0e14; --panel: #11151f; --border: #232a3a;
    --dim: #8b93a7; --faint: #5b6275; --text: #e6e9f2; --aether: #5eaefc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; background: var(--ink);
    font-family: "SF Mono", ui-monospace, Menlo, monospace; color: var(--text); }
  #stage { display: flex; flex-direction: column; align-items: center;
    gap: 0; padding: 18px 8px; }
  #col { border: 1px solid var(--border); }
  #head { padding: 8px 12px; background: var(--panel); font-size: 12px;
    letter-spacing: .05em; display: flex; justify-content: space-between;
    gap: 16px; }
  #head b { color: var(--text); font-weight: 600; }
  #head span { color: var(--faint); }
  #wrap { position: relative; width: 1280px; height: 448px;
    background: #000; }
  #wrap img, #wrap canvas { position: absolute; inset: 0;
    width: 1280px; height: 448px; image-rendering: pixelated; }
  #tabs, #loadout { display: flex; flex-wrap: wrap; background: var(--panel);
    border-top: 1px solid var(--border); }
  button.tab { font: inherit; font-size: 11px; letter-spacing: .05em;
    color: var(--dim); background: none; border: none; cursor: pointer;
    padding: 9px 11px; border-right: 1px solid var(--border); }
  button.tab:hover { color: var(--text); background: rgba(94,174,252,.06); }
  button.tab.on { color: var(--aether); background: rgba(94,174,252,.12); }
  #loadout .lbl, #loadout2 .lbl { font-size: 10px; color: var(--faint);
    letter-spacing: .1em; padding: 10px 6px 0 12px; }
  #loadout2 { display: flex; flex-wrap: wrap; background: var(--panel);
    border-top: 1px solid var(--border); }
  #opts { display: flex; gap: 14px; padding: 7px 12px;
    background: var(--panel); border-top: 1px solid var(--border);
    font-size: 11px; color: var(--faint); letter-spacing: .05em; }
  #opts label { cursor: pointer; user-select: none; }
  #foot { padding: 10px 4px; font-size: 10px; color: var(--faint);
    letter-spacing: .1em; text-align: center; line-height: 1.6; }
  @media (max-width: 1320px) {
    #wrap { width: 640px; height: 224px; }
    #wrap img, #wrap canvas { width: 640px; height: 224px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="col">
    <div id="head"><b id="fname">—</b><span id="fdesc"></span></div>
    <div id="wrap">
      <img id="bg" alt="">
      <canvas id="chars" width="320" height="112"></canvas>
    </div>
    <div id="tabs"></div>
    <div id="loadout">
      <span class="lbl">PLAYER</span><span id="speciesBtns"></span>
      <span class="lbl">WEAPON</span><span id="weaponBtns"></span>
    </div>
    <div id="loadout2">
      <span class="lbl">SHADING</span><span id="shadeBtns"></span>
      <span class="lbl">MOTION</span><span id="animBtns"></span>
      <span class="lbl">STRIKE</span><span id="strikeBtns"></span>
    </div>
    <div id="opts">
      <button id="lib" class="tab" style="border: 1px solid var(--aether);
        color: var(--aether); margin: -2px 0; padding: 5px 14px;
        letter-spacing: .12em;">LIBERATE</button>
      <label><input type="checkbox" id="animBg" checked> animated background</label>
      <label><input type="checkbox" id="showChars" checked> 3D combatants</label>
    </div>
  </div>
  <div id="foot">
    research/3d-fight demo2 · floor 1 — The Fencerows ·
    320×112 @4x (the game event grid) · players: Tripo3D characters ·
    background: designed 1-bit GIF loop · live three.js → Bayer 1-bit
  </div>
</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module">
  import { setFight, setPlayer, setGrip, probe, probePlayer, testAnimal,
    clipNames, liberate, fights, species, weapons, setShade, shades,
    setAnim, anims, setStrike, strikes } from "./fight2.js";
  window.fx = { setFight, setPlayer, setGrip, probe, probePlayer, testAnimal,
    clipNames, liberate, setShade, setAnim, setStrike };  // headless hook
  const F = fights(), S = species(), Wp = weapons(), Sh = shades(),
    A = anims(), St = strikes();
  const tabs = document.getElementById("tabs");
  const bg = document.getElementById("bg");
  const chars = document.getElementById("chars");
  const animBg = document.getElementById("animBg");
  const showChars = document.getElementById("showChars");
  let cur = null;

  function pick(id) {
    cur = id;
    bg.src = animBg.checked
      ? `./backgrounds/${id}.gif` : `./backgrounds/${id}_still.png`;
    document.getElementById("fname").textContent = F[id].name;
    document.getElementById("fdesc").textContent = F[id].desc;
    for (const b of tabs.children) b.classList.toggle("on", b.dataset.id === id);
    setFight(id);
  }
  for (const id of Object.keys(F)) {
    const b = document.createElement("button");
    b.className = "tab";
    b.textContent = F[id].name; b.dataset.id = id;
    b.onclick = () => pick(id);
    tabs.appendChild(b);
  }

  function makeGroup(elId, defs, cls, onpick, initial) {
    const host = document.getElementById(elId);
    for (const id of Object.keys(defs)) {
      const b = document.createElement("button");
      b.className = "tab " + cls;
      b.textContent = defs[id].label; b.dataset.id = id;
      if (id === initial) b.classList.add("on");
      b.onclick = () => {
        for (const x of host.children) x.classList.toggle("on", x === b);
        onpick(id);
      };
      host.appendChild(b);
    }
  }
  makeGroup("speciesBtns", S, "sp", (id) => setPlayer(id, null), "human");
  makeGroup("weaponBtns", Wp, "wp", (id) => setPlayer(null, id), "blade");
  makeGroup("shadeBtns", Sh, "sh", (id) => setShade(id), "bayer6");
  makeGroup("animBtns", A, "an", (id) => setAnim(id), "lively");
  makeGroup("strikeBtns", St, "st", (id) => setStrike(id), "random");

  document.getElementById("lib").onclick = () => liberate();
  document.addEventListener("la-freed", (e) => {
    document.getElementById("fdesc").textContent = e.detail.desc || "";
  });

  animBg.onchange = () => { if (cur) bg.src = animBg.checked
    ? `./backgrounds/${cur}.gif` : `./backgrounds/${cur}_still.png`; };
  showChars.onchange = () => {
    chars.style.display = showChars.checked ? "block" : "none"; };
  pick("grey_wolf");
</script>
</body>
</html>
